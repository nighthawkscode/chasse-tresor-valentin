<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:340px;height:340px;border-radius:78px;background:#12503f;overflow:hidden">
  <div style="position:absolute;left:50%;top:50%;width:340px;height:340px;background:radial-gradient(66% 60% at 50% 40%, #1c6b53 0%, #145244 58%, #0d3b30 100%);transform:translate(-50%,-50%)"></div>
  <div style="position:absolute;left:50%;top:150px;width:290px;height:290px;border-radius:50%;border:2px solid rgba(160,240,215,0.14);transform:translate(-50%,-50%)"></div>

  <div style="position:absolute;left:150px;top:146px;width:36px;height:196px;border-radius:18px;background:#c98a4d;transform:rotate(-38deg);transform-origin:top center;overflow:hidden">
    <div style="position:absolute;left:6px;top:118px;width:9px;height:62px;border-radius:5px;background:rgba(255,255,255,0.2)"></div>
    <div style="position:absolute;left:0;top:128px;width:36px;height:26px;background:#a86c34"></div>
  </div>


  <div style="position:absolute;left:62px;top:40px;width:212px;height:212px;border-radius:50%;background:#39c3a2"></div>
  <div style="position:absolute;left:78px;top:56px;width:180px;height:180px;border-radius:50%;background:#eafaf4;overflow:hidden">
    <div style="position:absolute;inset:0;background:radial-gradient(72% 62% at 44% 38%, #ffffff 0%, #e4f6ee 60%, #cfeade 100%)"></div>
    <div style="position:absolute;left:14px;top:12px;width:56px;height:96px;background:linear-gradient(150deg, rgba(255,255,255,0.9), rgba(255,255,255,0));border-radius:50%;transform:rotate(26deg)"></div>

    <sc-if value="{{ blush }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:22px;top:110px;width:46px;height:30px;background:radial-gradient(closest-side, rgba(255,132,96,0.4), rgba(255,132,96,0))"></div>
      <div style="position:absolute;left:112px;top:110px;width:46px;height:30px;background:radial-gradient(closest-side, rgba(255,132,96,0.4), rgba(255,132,96,0))"></div>
    </sc-if>

    <div style="position:absolute;left:36px;top:62px;width:36px;height:42px;border-radius:50%;background:#123a30"></div>
    <div style="position:absolute;left:44px;top:70px;width:13px;height:13px;border-radius:50%;background:#eafaf4"></div>

    <sc-if value="{{ openRightEye }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:108px;top:62px;width:36px;height:42px;border-radius:50%;background:#123a30"></div>
      <div style="position:absolute;left:116px;top:70px;width:13px;height:13px;border-radius:50%;background:#eafaf4"></div>
    </sc-if>
    <sc-if value="{{ winking }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:106px;top:72px;width:40px;height:22px;border-top:11px solid #123a30;border-radius:26px 26px 0 0"></div>
    </sc-if>

    <sc-if value="{{ mCroissant }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:60px;top:118px;width:58px;height:32px;background:#123a30;-webkit-clip-path:path('M2,2 C6,20 15,29 29,29 C43,29 52,20 56,2 C50,15 41,21 29,21 C17,21 8,15 2,2 Z');clip-path:path('M2,2 C6,20 15,29 29,29 C43,29 52,20 56,2 C50,15 41,21 29,21 C17,21 8,15 2,2 Z')"></div>
    </sc-if>
    <sc-if value="{{ mRire }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:58px;top:114px;width:62px;height:46px;background:#123a30;-webkit-clip-path:path('M3,7 C16,0 46,0 59,7 C59,32 47,45 31,45 C15,45 3,32 3,7 Z');clip-path:path('M3,7 C16,0 46,0 59,7 C59,32 47,45 31,45 C15,45 3,32 3,7 Z')"></div>
      <div style="position:absolute;left:74px;top:140px;width:30px;height:20px;border-radius:10px 10px 15px 15px;background:#ff7a6b"></div>
    </sc-if>
  </div>

  <sc-if value="{{ sparks }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:40px;top:274px;width:12px;height:12px;border-radius:50%;background:#a7f0d8"></div>
    <div style="position:absolute;left:296px;top:78px;width:9px;height:9px;border-radius:50%;background:#a7f0d8"></div>
    <div style="position:absolute;left:36px;top:64px;width:8px;height:8px;border-radius:50%;background:#a7f0d8"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:340},&quot;expression&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;curieux&quot;,&quot;malicieux&quot;,&quot;fier&quot;],&quot;default&quot;:&quot;curieux&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;blush&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sparks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const exp = this.props.expression ?? "curieux";
    const wink = exp === "malicieux";
    const wide = exp === "fier";
    return {
      blush: this.props.blush ?? true,
      sparks: this.props.sparks ?? true,
      winking: wink,
      openRightEye: !wink,
      mCroissant: !wide,
      mRire: wide
    };
  }
}
</script>
</body>
</html>
