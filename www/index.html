<meta charset="utf-8">
<title>Ludigo</title>

<style>
  :root {
    --paper:        #F1F7F4;
    --surface:      #FFFFFF;
    --ink:          #10221C;
    --muted:        #567065;
    --line:         #DCE9E3;
    --line-strong:  #B9D4C8;
    --hero:         #12503F;
    --hero-deep:    #0D3B30;
    --hero-soft:    #EAFAF4;
    --sur-hero:     #EAFAF4;

    --fam-ouvre:      #2A5EA8;
    --fam-ouvre-soft: #E7EEF9;
    --fam-sens:       #16786F;
    --fam-sens-soft:  #E3F2EF;
    --fam-faire:      #5B57A6;
    --fam-faire-soft: #EEECF8;
    --rare:         #B07C10;
    --rare-bg:      #FBF1DA;
    --rare-line:    #E7D6AE;
    --rare-ink:     #8A6009;

    --disp: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --corps: -apple-system, system-ui, "Segoe UI", sans-serif;

    --ombre-celeb: 0 10px 26px rgba(13,59,48,.38);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--corps); font-size: 17px; line-height: 1.45;
    -webkit-text-size-adjust: 100%; overflow-x: hidden; overscroll-behavior-y: none;
  }
  button { font-family: inherit; color: inherit; -webkit-appearance: none; appearance: none; }

  .ecran { min-height: 100vh; display: flex; flex-direction: column; }
  .contenu { flex: 1; max-width: 560px; width: 100%; margin: 0 auto; padding: 0 18px max(40px, env(safe-area-inset-bottom)); }

  /* ---------------- accueil ---------------- */
  .ecran-accueil { background: linear-gradient(180deg, var(--hero-soft) 0%, var(--paper) 60%); }
  .accueil-tete { padding: max(20px, env(safe-area-inset-top)) 18px 8px; display: flex; flex-direction: column; gap: 4px; }
  .accueil-tete .marque { display: flex; align-items: center; gap: 10px; }
  .accueil-tete .marque .badge {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .accueil-tete h1 {
    font-family: var(--disp); font-weight: 800; font-size: 27px;
    margin: 0; letter-spacing: -0.01em;
  }
  .accueil-tete p { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
  .info-carte.parent { background: var(--hero-soft); border-color: transparent; }
  .info-carte.parent .lab { color: var(--hero-deep); }

  .cartes-lieux { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; }
  .carte-lieu {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; padding: 14px; text-align: left; width: 100%;
    cursor: pointer; transition: transform .1s ease;
  }
  .carte-lieu:active { transform: scale(.98); }
  .carte-lieu.en-cours { border: 1.5px solid var(--hero); }
  .carte-lieu .picto {
    flex: none; width: 66px; height: 66px; border-radius: 18px;
    background: var(--hero-soft); display: flex; align-items: center; justify-content: center;
  }
  .carte-lieu .picto svg { width: 40px; height: 40px; }
  .carte-lieu .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .carte-lieu .txt b { font-family: var(--disp); font-size: 19px; font-weight: 800; color: var(--ink); }
  .carte-lieu .txt span { font-size: 13px; color: var(--muted); }
  .carte-lieu .txt .barre-mini {
    height: 5px; border-radius: 3px; background: var(--hero-soft); margin-top: 4px; overflow: hidden;
  }
  .carte-lieu .txt .barre-mini > i { display: block; height: 100%; background: var(--hero); border-radius: 3px; }
  .carte-lieu .chevron { font-size: 28px; font-weight: 700; color: var(--hero); line-height: 1; flex: none; }

  .bas-accueil { margin-top: 22px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .lien-discret {
    background: none; border: none; color: var(--muted); font-size: 13px;
    text-decoration: underline; text-underline-offset: 3px; padding: 8px; cursor: pointer;
    display: inline-block; margin: 0 auto;
  }

  /* ---------------- boutons ---------------- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 58px; padding: 0 22px; border-radius: 29px; border: none;
    background: var(--hero); color: var(--sur-hero);
    font-family: var(--disp); font-weight: 800; font-size: 18px; cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .btn.creux { background: transparent; color: var(--hero); border: 2px solid var(--hero); height: 52px; font-size: 16px; }

  /* ---------------- intro / sécurité ---------------- */
  .intro-tete { display: flex; align-items: center; gap: 6px; padding: max(14px, env(safe-area-inset-top)) 18px 0; }
  .intro-tete .retour {
    background: none; border: none; color: var(--muted); font-size: 15px; font-weight: 600;
    padding: 6px 4px; cursor: pointer;
  }
  .intro-badge {
    width: 74px; height: 74px; border-radius: 18px; margin: 14px auto 14px;
    background: var(--hero-soft); display: flex; align-items: center; justify-content: center;
  }
  .intro-badge svg { width: 42px; height: 42px; }
  .intro h2 { font-family: var(--disp); font-weight: 800; font-size: 25px; text-align: center; margin: 0 0 4px; }
  .intro .sous { text-align: center; color: var(--muted); font-size: 14.5px; margin-bottom: 20px; }
  .carnet-picker { display: flex; gap: 8px; margin: 0 0 18px; }
  .chip-carnet {
    flex: 1; background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
    padding: 10px 6px; text-align: center; cursor: pointer; font-family: inherit;
  }
  .chip-carnet b { display: block; font-family: var(--disp); font-size: 15px; font-weight: 800; color: var(--ink); }
  .chip-carnet span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .chip-carnet.actif { border-color: var(--hero); background: var(--hero-soft); }
  .chip-carnet.actif b { color: var(--hero); }
  .info-carte {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 14px; font-size: 15px; line-height: 1.5;
  }
  .info-carte.alerte { background: var(--rare-bg); border-color: var(--rare-line); }
  .info-carte .lab {
    display: block; font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--hero); margin-bottom: 6px;
  }
  .info-carte.alerte .lab { color: var(--rare); }

  /* ---------------- bandeau de jeu ---------------- */
  .bandeau {
    position: sticky; top: 0; z-index: 30; background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: max(10px, env(safe-area-inset-top)) 18px 14px;
  }
  .bandeau-int { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .bandeau-ligne1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .btn-retour {
    background: none; border: none; color: var(--muted); font-family: var(--mono);
    font-size: 13px; font-weight: 700; padding: 4px 0; cursor: pointer;
  }
  .rares-tag { font-size: 12px; font-weight: 700; color: var(--rare); font-variant-numeric: tabular-nums; }
  .bandeau-ligne2 { display: flex; align-items: center; gap: 16px; }
  .anneau-jeu { position: relative; flex: none; width: 64px; height: 64px; border-radius: 50%; }
  .anneau-jeu .disque {
    position: absolute; inset: 8px; border-radius: 50%; background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .anneau-jeu .disque .n { font-size: 14px; font-weight: 800; line-height: 1; }
  .anneau-jeu .disque .d { font-size: 10.5px; color: var(--muted); line-height: 1.2; }
  .pts-bloc { display: flex; align-items: baseline; gap: 8px; }
  .pts-bloc .val {
    font-size: 42px; font-weight: 900; color: var(--hero); line-height: .9; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .pts-bloc .lab {
    font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }

  /* ---------------- familles : zones teintées ---------------- */
  .famille {
    border-radius: 20px; padding: 11px 10px 12px; margin-top: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .famille.z-ouvre { background: var(--fam-ouvre-soft); }
  .famille.z-sens  { background: var(--fam-sens-soft); }
  .famille.z-faire { background: var(--fam-faire-soft); }
  .famille.z-rares { background: var(--rare-bg); }

  .fam-tete { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .fam-tete .lab {
    font-family: var(--mono); font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  }
  .fam-tete .n { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  .fam-tete .n.rare-n { color: var(--rare-ink); }
  .fam-tete .etoile { font-size: 14px; color: var(--rare); line-height: 1; }

  .item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid rgba(16,34,43,.06); border-radius: 13px;
    padding: 10px 13px; cursor: pointer;
  }
  .item .libelle { flex: 1; font-size: 14.5px; font-weight: 600; line-height: 1.25; min-width: 0; }
  .item .tag { flex: none; font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .etoile-rare { width: 21px; font-size: 19px; color: var(--rare); text-align: center; flex: none; line-height: 1; }

  .item.faite { background: var(--hero-soft); border-color: var(--hero); }
  .item.faite .libelle { opacity: .55; text-decoration: line-through; text-decoration-thickness: 2px; }
  .item.faite .tag { color: var(--hero); font-weight: 800; }

  .item.rare { border: 2px solid var(--rare); background: #FFFDF7; }
  .item.rare .tag { color: var(--rare-ink); }
  .item.rare.faite { background: var(--rare-bg); }
  .item.rare.faite .tag { color: var(--rare); }

  .btn-terminer { margin-top: 26px; }

  /* pastille */
  .pastille {
    position: fixed; left: 16px; right: 16px; bottom: max(18px, calc(env(safe-area-inset-bottom) + 8px)); z-index: 60;
    height: 56px; border-radius: 28px; background: var(--hero);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: var(--ombre-celeb); max-width: 528px; margin: 0 auto;
    animation: pastille-in .28s cubic-bezier(.2,1,.3,1) both;
  }
  .pastille .glyphe { font-size: 19px; color: var(--sur-hero); }
  .pastille .msg { font-size: 18px; font-weight: 800; color: var(--sur-hero); }
  @keyframes pastille-in { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .pastille.sort { animation: pastille-out .2s ease both; }
  @keyframes pastille-out { to { transform: translateY(14px); opacity: 0; } }

  /* écran de palier */
  .palier-ecran {
    position: fixed; inset: 0; z-index: 70; background: var(--hero-deep); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 24px 26px 30px; text-align: center;
    animation: fondu-entre .25s ease both;
  }
  @keyframes fondu-entre { from { opacity: 0; } to { opacity: 1; } }
  .palier-ecran .lab {
    font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: #A7F0D8;
  }
  .zoe-palier { border-radius: 24px; box-shadow: 0 16px 32px rgba(13,59,48,.4); }
  .anneau-palier { width: 178px; height: 178px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .anneau-palier .disque {
    width: 142px; height: 142px; border-radius: 50%; background: var(--hero-deep);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .anneau-palier .disque .pct { font-size: 48px; font-weight: 900; color: #fff; line-height: 1; letter-spacing: -0.02em; }
  .anneau-palier .disque .sur { font-size: 13.5px; font-weight: 700; color: #A7F0D8; }
  .palier-ecran h3 { font-family: var(--disp); font-size: 28px; font-weight: 900; line-height: 1.1; margin: 0; color: #fff; }
  .palier-ecran p { font-size: 15.5px; line-height: 1.45; color: #CFEADE; max-width: 280px; margin: 0; }
  .pips { display: flex; align-items: center; gap: 8px; }
  .pips span { width: 32px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.2); }
  .pips span.faite { background: #39C3A2; }
  .chip-pts { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.12); border-radius: 18px; padding: 11px 17px; }
  .chip-pts .val { font-size: 25px; font-weight: 900; color: #fff; line-height: 1; }
  .chip-pts .lab2 { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #CFEADE; line-height: 1.3; }
  .btn-palier {
    height: 58px; width: 100%; max-width: 340px; border-radius: 29px; background: #fff;
    color: var(--hero-deep); font-family: var(--disp); font-size: 17px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; margin-top: 2px;
  }

  /* confettis */
  .confetti-scene { position: fixed; inset: 0; z-index: 65; pointer-events: none; overflow: hidden; }
  .confetti { position: absolute; top: -20px; will-change: transform, opacity; animation-name: chute; animation-timing-function: cubic-bezier(.3,.6,.4,1); animation-fill-mode: forwards; }
  @keyframes chute {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(var(--dy)) translateX(var(--dx)) rotate(var(--rot)); opacity: 0; }
  }

  /* fin / diplôme */
  .fin-contenu {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 15px; text-align: center; max-width: 400px; margin: 0 auto; width: 100%;
    padding: max(26px, env(safe-area-inset-top)) 26px max(30px, env(safe-area-inset-bottom));
  }
  .fin-contenu .lab { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .fin-contenu h2 { font-family: var(--disp); font-size: 26px; font-weight: 900; line-height: 1.15; margin: 0; }
  .zoe-fin { border-radius: 22px; box-shadow: 0 10px 26px rgba(13,59,48,.32); }
  .anneau-fin { width: 156px; height: 156px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 2px 0; }
  .anneau-fin .disque { width: 130px; height: 130px; border-radius: 50%; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .anneau-fin .disque .n { font-size: 40px; font-weight: 900; color: var(--hero); line-height: 1; }
  .anneau-fin .disque .lg { font-size: 13px; font-weight: 700; color: var(--muted); }
  .stats-3 { display: flex; gap: 10px; width: 100%; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 13px 8px; display: flex; flex-direction: column; gap: 3px; }
  .stat.or { background: var(--rare-bg); border-color: var(--rare); }
  .stat .val { font-size: 22px; font-weight: 900; line-height: 1; color: var(--ink); }
  .stat.or .val { color: var(--rare); }
  .stat .val.hero-c { color: var(--hero); }
  .stat .lab { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .stat.or .lab { color: var(--rare-ink); }
  .fin-dedicace { font-size: 14.5px; line-height: 1.45; color: var(--muted); }
  .fin-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 2px; }

  :focus-visible { outline: 3px solid var(--hero); outline-offset: 2px; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>

<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     0. PAGE SETUP
     ============================================================ */
  function meta(attr, nom, valeur) {
    if (document.querySelector("meta[" + attr + '="' + nom + '"]')) return;
    const m = document.createElement("meta");
    m.setAttribute(attr, nom); m.content = valeur;
    document.head.appendChild(m);
  }
  meta("name", "viewport", "width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1");
  meta("name", "theme-color", "#12503F");
  meta("name", "apple-mobile-web-app-capable", "yes");
  meta("name", "apple-mobile-web-app-title", "Trésors");
  meta("name", "apple-mobile-web-app-status-bar-style", "default");
  document.documentElement.lang = "fr";
  if (!document.querySelector('link[rel="manifest"]')) {
    const l = document.createElement("link"); l.rel = "manifest"; l.href = "./manifest.webmanifest";

  }
  if (!document.querySelector('link[rel="apple-touch-icon"]')) {
    const li = document.createElement("link"); li.rel = "apple-touch-icon"; li.href = "./icones/icone-180.png";
    document.head.appendChild(li);
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  /* ============================================================
     1. DONNÉES — 3 typologies × 3 carnets (inchangé)
     ============================================================ */
  function C(items) { return items; }

  const TYPOLOGIES = [
    {
      id: "montagne", nom: "Montagne", motLieu: "des sommets",
      accroche: "Sentiers, sommets, torrents",
      secu: "On reste sur le sentier, on garde les grands en vue. Si le ciel s'assombrit, on écoute l'adulte sans discuter. On ne court pas sur des pierres qui bougent, on ne s'approche pas du bord d'un torrent ou d'une pente raide. On ne ramasse ni ne déplace rien dans la nature : on regarde, on photographie, et on repose tout ce qu'on a pris en main.",
      carnets: [
        { id: "A",
          ouvre: C([["Une tache de neige qui a survécu à l'été",15],["Un caillou avec des paillettes qui brillent au soleil",10],["Trois couleurs de cailloux différentes sur le même chemin",15],["Un nuage qui touche une montagne",10],["Le lit d'un torrent, même sec",10],["Un caillou tout rond, poli par l'eau",15],["Une trace de pas d'animal dans la boue ou la neige",15],["Une touffe de poils ou de laine accrochée à un buisson",20],["Un tas de pierres empilées par quelqu'un pour marquer le chemin",5],["Un sentier qui fait des zigzags",5],["Trois nuances de vert différentes dans le même regard",10],["Une fleur jaune",5],["Une fleur bleue ou violette",10],["Une fleur blanche",5],["Le dernier arbre avant qu'il n'y en ait plus du tout",15],["Un endroit d'où on voit plus loin que partout où tu es déjà allé",10]]),
          sens: C([["Toucher une pierre froide à l'ombre, puis une chaude au soleil",10],["Toucher de la mousse : douce, ou piquante ?",10],["Écouter l'eau qui coule, et deviner si elle est proche ou loin",15],["Le crissement du gravier sous tes pieds",5],["Une odeur de pierre chauffée par le soleil",10],["Une odeur de plante froissée",10],["Ta respiration qui devient plus forte en montant",5],["Ton cœur qui bat plus vite après une montée",5],["Dix secondes de silence complet, tous ensemble",15],["Le goût de l'eau que tu as emportée",5]]),
          faire: C([["Prendre une photo vraiment rigolote",5],["Imiter la démarche d'un randonneur fatigué, ou le vol d'un oiseau",5],["Boire une gorgée d'eau en regardant le plus loin possible",5],["Repérer un caillou en forme de cœur",20],["Deviner le temps qu'il faudrait pour atteindre un sommet visible, puis vérifier avec un adulte",15],["Marcher vingt pas sans faire de bruit",15],["Se retourner et montrer d'où on est partis",5],["Donner un nom inventé à une montagne, pour la journée",5],["Inventer un cri de ralliement pour l'équipe",5],["Compter les virages du sentier pendant dix minutes",15],["Ramasser un déchet qui n'est pas à nous",15]]),
          rares: C([["Un grand oiseau qui plane sans battre des ailes",20],["Un arc-en-ciel, ou un rayon qui traverse les nuages",25],["Un animal sauvage, quel qu'il soit",20],["Le grondement d'un torrent invisible sous les pierres",25],["Un écho, en criant face à une paroi",25],["Un animal qui siffle pour prévenir les autres d'un danger",30],["Un grand chien qui protège un troupeau",25]])
        },

  function zoeBox(sizePx, mood, opts) {
    const echelle = sizePx / 340;
    return '<div style="width:' + sizePx + 'px;height:' + sizePx + 'px;overflow:hidden;flex:none" aria-hidden="true">' +
      '<div style="width:340px;height:340px;transform:scale(' + echelle + ');transform-origin:top left">' +
      zoeHTML(mood, opts) +

  /* ============================================================
     3. ÉTAT — une progression indépendante par typologie
     ============================================================ */
  const CLE = "tresors-dici-v3";
  function etatVide() { return { progres: {}, dernier: {}, vue: { ecran: "accueil" } }; }
  let S = charger();
  function charger() {
    try {
      const b = localStorage.getItem(CLE);
      const d = b ? Object.assign(etatVide(), JSON.parse(b)) : etatVide();
      if (!d.vue) d.vue = { ecran: "accueil" };
      if (!d.progres) d.progres = {};
      if (!d.dernier) d.dernier = {};
      return d;
    } catch (e) { return etatVide(); }
  }
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {} }

  const ORDRE_CARNETS = ["A", "B", "C"];
  function progresCarnet(typoId, carnetId) {
    if (!S.progres[typoId]) S.progres[typoId] = {};
    if (!S.progres[typoId][carnetId]) S.progres[typoId][carnetId] = { coches: {}, paliers: [] };
    return withTypo(S.progres[typoId][carnetId], typoId, carnetId);
  }
  function carnetSuggere(typoId) {
    for (let i = 0; i < ORDRE_CARNETS.length; i++) {
      const cid = ORDRE_CARNETS[i];
      const pr = S.progres[typoId] && S.progres[typoId][cid];
      if (!pr || scoreEtProgres(withTypo(pr, typoId, cid)).pct < 100) return cid;
    }
    return ORDRE_CARNETS[0];
  }

  /* ============================================================
     4. OUTILS DOM
     ============================================================ */
  const app = document.getElementById("app");
  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  /* Vibration : Haptics natif si l'app tourne dans Capacitor (Xcode/App Store),
     sinon repli sur l'API web standard (PWA hors-ligne). */
  function capacitorNatif() {
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  }
  function vibre(m) {
    if (capacitorNatif() && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) {
      const intense = Array.isArray(m) ? m.length > 2 : m > 40;
      window.Capacitor.Plugins.Haptics.impact({ style: intense ? "MEDIUM" : "LIGHT" }).catch(function () {});
      return;
    }
    if (navigator.vibrate) navigator.vibrate(m);
  }

  /* ============================================================
     5. CONFETTIS + PASTILLE
     ============================================================ */
  function lancerConfettis(n) {
    const scene = el("div", "confetti-scene");
    document.body.appendChild(scene);
    const largeur = window.innerWidth;
    for (let i = 0; i < n; i++) {
      const c = el("div", "confetti");
      const taille = 8 + Math.random() * 7;
      c.style.left = (Math.random() * largeur) + "px";
      c.style.width = taille + "px"; c.style.height = taille + "px";
      c.style.background = CONFETTI_COULEURS[i % CONFETTI_COULEURS.length];
      c.style.borderRadius = "4px";
      c.style.animationDuration = (1500 + Math.random() * 1400) + "ms";
      c.style.setProperty("--dy", (window.innerHeight * (0.6 + Math.random() * 0.5)) + "px");
      c.style.setProperty("--dx", ((Math.random() - 0.5) * 160) + "px");
      c.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      c.style.animationDelay = (Math.random() * 150) + "ms";
      scene.appendChild(c);
    }
    setTimeout(function () { scene.remove(); }, 3200);
  }

  let pastilleTimer = null;
  function montrerPastille(msg) {
    const ancienne = document.querySelector(".pastille");
    if (ancienne) ancienne.remove();
    const p = el("div", "pastille");
    p.appendChild(el("span", "glyphe", "✦"));
    p.appendChild(el("span", "msg", msg));
    document.body.appendChild(p);
    clearTimeout(pastilleTimer);
    pastilleTimer = setTimeout(function () {
      p.classList.add("sort");
      setTimeout(function () { p.remove(); }, 220);
    }, 1800);
  }

  const MESSAGES_PALIER = {
    25: ["Bien parti !", "Encore un bon bout de chemin et le diplôme est à vous. Qui repère la prochaine ?"],
    50: ["À mi-chemin !", "La moitié du carnet est déjà cochée. Continuez comme ça."],
    75: ["Trois quarts du carnet !", "Encore un petit effort et le diplôme est à vous. Qui repère la prochaine ?"],
    100: ["Carnet complet !", "Chaque trésor de ce carnet a été trouvé. Bravo à toute l'équipe."]
  };

  function celebrerPalier(pct, sp) {
    const msg = MESSAGES_PALIER[pct];
    if (!msg) return;
    vibre(pct === 100 ? [40, 60, 40, 60, 120] : 50);
    lancerConfettis(pct === 100 ? 90 : 50);

    const ov = el("div", "palier-ecran");
    const zoe = el("div", "zoe-palier");
    zoe.innerHTML = zoeBox(104, "fier", { sparks: true });
    ov.appendChild(zoe);
    ov.appendChild(el("span", "lab", "Palier atteint"));
    const ang = el("div", "anneau-palier");
    ang.style.background = "conic-gradient(#39C3A2 " + pct + "%, rgba(255,255,255,.16) 0)";
    const disque = el("div", "disque");
    disque.appendChild(el("div", "pct", pct + " %"));
    disque.appendChild(el("div", "sur", sp.faits + " sur " + sp.total));
    ang.appendChild(disque);
    ov.appendChild(ang);
    ov.appendChild(el("h3", null, msg[0]));
    ov.appendChild(el("p", null, msg[1]));
    const pips = el("div", "pips");
    [25, 50, 75, 100].forEach(function (p) { pips.appendChild(el("span", pct >= p ? "faite" : "")); });
    ov.appendChild(pips);
    const chip = el("div", "chip-pts");
    chip.appendChild(el("div", "val", sp.pts));
    chip.appendChild(el("div", "lab2", "points<br>dont " + sp.raresFaits + " rares ★"));
    ov.appendChild(chip);
    const btn = el("button", "btn-palier", pct === 100 ? "Voir le diplôme" : "On continue !");
    btn.addEventListener("click", function () {
      ov.remove();
      if (pct === 100) { S.vue.ecran = "fin"; sauver(); dessiner(); }
    });
    ov.appendChild(btn);
    document.body.appendChild(ov);
  }

  /* ============================================================
     6. SCORE
     ============================================================ */
  function scoreEtProgres(p) {
    const c = carnet(p.typo, p.carnet);
    const ck = p.coches;
    let pts = 0, faits = 0, raresFaits = 0;
    toutesFamilles(c).forEach(function (pair) {
      pair[1].forEach(function (item, i) { if (ck[pair[0] + i]) { pts += item[1]; faits++; } });
    });
    c.rares.forEach(function (item, i) { if (ck["rares" + i]) { pts += item[1]; raresFaits++; faits++; } });
    const total = totalCarnet(c);
    const totalSansRares = total - c.rares.length;
    const pct = totalSansRares ? Math.round(((faits - raresFaits) / totalSansRares) * 100) : 0;
    return { pts: pts, faits: faits, total: total, raresFaits: raresFaits, totalRares: c.rares.length, pct: Math.min(100, pct) };
  }
  function withTypo(p, typoId, carnetId) { p.typo = typoId; if (carnetId) p.carnet = carnetId; return p; }

  /* ============================================================
     7. RENDU
     ============================================================ */
  function dessiner() {
    app.innerHTML = "";
    const v = S.vue;
    if (v.ecran === "jeu") { app.appendChild(ecranJeu(v.typo)); return; }
    if (v.ecran === "fin") { app.appendChild(ecranFin(v.typo)); return; }
    if (v.ecran === "intro") { app.appendChild(ecranIntro(v.typo)); return; }
    app.appendChild(ecranAccueil());
  }

  function aller(ecran, typoId, carnetId) {
    S.vue = { ecran: ecran, typo: typoId, carnet: carnetId };
    if (carnetId) S.dernier[typoId] = carnetId;
    sauver(); dessiner();
  }

  /* ---------- accueil ---------- */
  function ecranAccueil() {
    const e = el("div", "ecran ecran-accueil");
    const c = el("div", "contenu");

    const tete = el("div", "accueil-tete");
    const marque = el("div", "marque");
    const badge = el("div", "badge");
    badge.innerHTML = zoeBox(40, "curieux", { sparks: false });
    marque.appendChild(badge);
    marque.appendChild(el("h1", null, "Ludigo"));
    tete.appendChild(marque);
    tete.appendChild(el("p", null, "Où allez-vous aujourd'hui ?"));
    c.appendChild(tete);

    const explique = el("div", "info-carte parent");
    explique.innerHTML = '<span class="lab">Pour les parents</span>' +
      "Pas besoin de préparer quoi que ce soit : dites-nous où vous êtes (montagne, musée, ville…) et l'appli " +
      "propose aussitôt une vraie chasse au trésor adaptée, pour occuper les enfants pendant toute la sortie, " +
      "où que vous soyez dans le monde. Ils cochent ce qu'ils trouvent à leur rythme, jusqu'au diplôme final.";
    c.appendChild(explique);

    const cartes = el("div", "cartes-lieux");
    TYPOLOGIES.forEach(function (t) {
      const progresT = S.progres[t.id] || {};
      const scores = ORDRE_CARNETS.map(function (cid) {
        return progresT[cid] ? scoreEtProgres(progresCarnet(t.id, cid)) : null;
      });
      const finis = scores.filter(function (s) { return s && s.pct >= 100; }).length;
      const commence = scores.some(function (s) { return s && s.faits > 0; });

      const b = el("div", "carte-lieu" + (commence ? " en-cours" : ""));
      b.setAttribute("role", "button");
      b.tabIndex = 0;
      const picto = el("div", "picto");
      picto.innerHTML = SVG_TYPO[t.id]();
      b.appendChild(picto);

      const txt = el("div", "txt");
      txt.appendChild(el("b", null, t.nom));

      const dernierCid = S.dernier[t.id];
      const dernierSp = dernierCid && progresT[dernierCid] ? scoreEtProgres(progresCarnet(t.id, dernierCid)) : null;
      if (dernierSp && dernierSp.pct < 100) {
        const totalSansRares = dernierSp.total - dernierSp.totalRares;
        txt.appendChild(el("span", null, "Carnet " + dernierCid + " en cours · " + (dernierSp.faits - dernierSp.raresFaits) + "/" + totalSansRares));
        const barre = el("div", "barre-mini");
        barre.appendChild(el("i")).style.width = dernierSp.pct + "%";
        txt.appendChild(barre);
      } else if (finis > 0) {
        txt.appendChild(el("span", null, finis + "/3 carnets terminés"));
      } else {
        const cid = carnetSuggere(t.id);
        const cnt = carnet(t.id, cid);
        txt.appendChild(el("span", null, "3 carnets · " + totalCarnet(cnt) + " trouvailles"));
      }
      b.appendChild(txt);
      b.appendChild(el("span", "chevron", "›"));
      b.addEventListener("click", function () { aller("intro", t.id); });
      cartes.appendChild(b);
    });
    c.appendChild(cartes);

    const bas = el("div", "bas-accueil");
    const reset = el("button", "lien-discret", "Tout effacer et recommencer à zéro");
    reset.addEventListener("click", function () {
      if (!confirm("Effacer toutes les sorties en cours, pour toutes les typologies ?")) return;
      S = etatVide(); sauver(); dessiner();
    });
    bas.appendChild(reset);
    const confid = el("a", "lien-discret");
    confid.textContent = "Politique de confidentialité";
    confid.href = "https://findaro-legal.vercel.app";
    confid.target = "_blank";
    confid.rel = "noopener";
    bas.appendChild(confid);
    c.appendChild(bas);

    e.appendChild(c);
    return e;
  }

  /* ---------- intro / sécurité ---------- */
  function ecranIntro(typoId) {
    const t = typo(typoId);
    if (!S.vue.carnet) {
      const d = S.dernier[typoId];
      const dEstFini = d && scoreEtProgres(progresCarnet(typoId, d)).pct >= 100;
      S.vue.carnet = (d && !dEstFini) ? d : carnetSuggere(typoId);
    }
    const cid = S.vue.carnet;
    const cnt = carnet(typoId, cid);
    const sp = scoreEtProgres(progresCarnet(typoId, cid));
    const e = el("div", "ecran");

    const tete = el("div", "intro-tete");
    const retour = el("button", "retour", "← Accueil");
    retour.addEventListener("click", function () { S.vue = { ecran: "accueil" }; sauver(); dessiner(); });
    tete.appendChild(retour);
    e.appendChild(tete);

    const c = el("div", "contenu intro");
    const badge = el("div", "intro-badge");
    badge.innerHTML = SVG_TYPO[typoId]();
    c.appendChild(badge);
    c.appendChild(el("h2", null, t.nom));

    const picker = el("div", "carnet-picker");
    ORDRE_CARNETS.forEach(function (id) {
      const spId = scoreEtProgres(progresCarnet(typoId, id));
      const statut = spId.faits === 0 ? "Pas commencé" : spId.pct >= 100 ? "Terminé ✓" : "En cours";
      const chip = el("button", "chip-carnet" + (id === cid ? " actif" : ""));
      chip.type = "button";
      chip.innerHTML = "<b>Carnet " + id + "</b><span>" + statut + "</span>";
      chip.addEventListener("click", function () { S.vue.carnet = id; sauver(); dessiner(); });
      picker.appendChild(chip);
    });
    c.appendChild(picker);

    const secu = el("div", "info-carte alerte");
    secu.innerHTML = '<span class="lab">Avant de partir</span>' + t.secu;
    c.appendChild(secu);

    const obj = el("div", "info-carte");
    obj.innerHTML = '<span class="lab">Comment on joue</span>' +
      "Cochez ce que vous trouvez, dans n'importe quel ordre, à votre rythme. " +
      "Les <strong>" + (totalCarnet(cnt) - cnt.rares.length) + " trésors</strong> réguliers rapportent des points. " +
      "Les <strong>" + cnt.rares.length + " rares ★</strong> sont un bonus : ils arrivent quand ils arrivent, rien d'obligatoire.";
    c.appendChild(obj);

    const label = sp.faits === 0 ? "C'est parti !" : sp.pct >= 100 ? "Rejouer ce carnet" : "Reprendre";
    const btn = el("button", "btn", label);
    btn.addEventListener("click", function () { aller("jeu", typoId, cid); });
    c.appendChild(btn);

    e.appendChild(c);
    return e;
  }

  /* ---------- jeu ---------- */
  function anneauJeuHTML(pct, faits, total) {
    return '<div class="anneau-jeu" id="anneau-jeu" style="background:conic-gradient(var(--hero) ' + pct + '%, var(--hero-soft) 0)">' +
      '<div class="disque"><div class="n">' + faits + '</div><div class="d">/ ' + total + '</div></div></div>';
  }

  function ecranJeu(typoId) {
    const t = typo(typoId);
    const cid = S.vue.carnet;
    const p = progresCarnet(typoId, cid);
    const cnt = carnet(typoId, p.carnet);
    const e = el("div", "ecran");

    const bandeau = el("div", "bandeau");
    const int_ = el("div", "bandeau-int");
    const l1 = el("div", "bandeau-ligne1");
    const retour = el("button", "btn-retour", "← Accueil");
    retour.addEventListener("click", function () { S.vue = { ecran: "accueil" }; sauver(); dessiner(); });
    l1.appendChild(retour);
    const sp0 = scoreEtProgres(p);
    l1.appendChild(el("span", "rares-tag", "★ " + sp0.raresFaits + "/" + cnt.rares.length + " rares"));
    int_.appendChild(l1);

    const l2 = el("div", "bandeau-ligne2");
    l2.innerHTML = anneauJeuHTML(sp0.pct, sp0.faits - sp0.raresFaits, totalCarnet(cnt) - cnt.rares.length);
    const ptsBloc = el("div", "pts-bloc");
    ptsBloc.innerHTML = '<span class="val" id="pts-val">' + sp0.pts + '</span><span class="lab">points</span>';
    l2.appendChild(ptsBloc);
    int_.appendChild(l2);
    bandeau.appendChild(int_);
    e.appendChild(bandeau);

    const c = el("div", "contenu");
    toutesFamilles(cnt).forEach(function (pair) {
      c.appendChild(blocFamille(p, pair[0], pair[1], false));
    });
    c.appendChild(blocFamille(p, "rares", cnt.rares, true));

    const finBtn = el("button", "btn creux btn-terminer", "Terminer la sortie");
    finBtn.addEventListener("click", function () { aller("fin", typoId, cid); });
    c.appendChild(finBtn);

    const bas = el("div", "bas-accueil");
    const recommencer = el("button", "lien-discret", "Recommencer ce carnet à zéro");
    recommencer.addEventListener("click", function () {
      if (!confirm("Effacer votre progression sur ce carnet et repartir de zéro ?")) return;
      S.progres[typoId][cid] = { coches: {}, paliers: [] };
      sauver(); dessiner();
    });
    bas.appendChild(recommencer);
    c.appendChild(bas);

    e.appendChild(c);
    return e;
  }

  function blocFamille(p, cle, items, estRare) {
    const bloc = el("div", "famille z-" + cle);
    const tete = el("div", "fam-tete");
    const ck = p.coches;
    const faits = items.filter(function (_, i) { return ck[cle + i]; }).length;

    if (estRare) {
      tete.appendChild(el("span", "etoile", "★"));
      const lab = el("span", "lab", "Les rares"); lab.style.color = "var(--rare)"; tete.appendChild(lab);
      tete.appendChild(el("span", "n rare-n", faits + "/" + items.length));
    } else {
      const lab = el("span", "lab", NOMS_FAMILLE[cle]); lab.style.color = "var(--fam-" + cle + ")";
      tete.appendChild(lab);
      tete.appendChild(el("span", "n", faits + "/" + items.length));
    }
    bloc.appendChild(tete);

    items.forEach(function (item, i) {
      const txt = item[0], pts = item[1];
      const cleItem = cle + i;
      const fait = !!ck[cleItem];
      const row = el("button", "item" + (estRare ? " rare" : "") + (fait ? " faite" : ""));
      row.type = "button";
      if (estRare) row.appendChild(el("span", "etoile-rare", "★"));
      row.appendChild(el("span", "libelle", txt));
      row.appendChild(el("span", "tag", "+" + pts));
      row.addEventListener("click", function () { basculerItem(p, cleItem, row, estRare, pts); });
      bloc.appendChild(row);
    });
    return bloc;
  }

  function basculerItem(p, cleItem, rowEl, estRare, pts) {
    const ck = p.coches;
    if (ck[cleItem]) {
      delete ck[cleItem];
      sauver(); dessiner();
      return;
    }
    ck[cleItem] = true;
    sauver();
    vibre(estRare ? [20, 30, 20] : 22);
    montrerPastille((estRare ? "Rare trouvée ! +" : "+") + pts + " points" + (estRare ? "" : " ! Bravo"));

    const cnt = carnet(p.typo, p.carnet);
    const sp = scoreEtProgres(p);
    const paliers = [25, 50, 75, 100];
    let toucheP = null;
    if (!p.paliers) p.paliers = [];
    paliers.forEach(function (pl) {
      if (sp.pct >= pl && p.paliers.indexOf(pl) === -1) { p.paliers.push(pl); toucheP = pl; }
    });
    sauver();

    const ptsVal = document.getElementById("pts-val");
    if (ptsVal) ptsVal.textContent = sp.pts;
    const anneau = document.getElementById("anneau-jeu");
    if (anneau) {
      anneau.style.background = "conic-gradient(var(--hero) " + sp.pct + "%, var(--hero-soft) 0)";
      anneau.querySelector(".n").textContent = sp.faits - sp.raresFaits;
    }
    const raresTag = document.querySelector(".rares-tag");
    if (raresTag) raresTag.textContent = "★ " + sp.raresFaits + "/" + cnt.rares.length + " rares";

    rowEl.classList.add("faite");
    const famTete = rowEl.parentElement.querySelector(".fam-tete .n");
    if (famTete) {
      const parts = famTete.textContent.split("/");
      famTete.textContent = (parseInt(parts[0], 10) + 1) + "/" + parts[1];
    }

    if (toucheP) setTimeout(function () { celebrerPalier(toucheP, sp); }, 350);
  }

  /* ---------- fin / diplôme ---------- */
  const QUALIFICATIFS = [
    { min: 0, mot: "Apprenti" },
    { min: 25, mot: "" },
    { min: 50, mot: "Grand" },
    { min: 75, mot: "Expert" },
    { min: 100, mot: "Maître" }
  ];
  function qualificatifPour(pct) {
    let q = QUALIFICATIFS[0];
    QUALIFICATIFS.forEach(function (x) { if (pct >= x.min) q = x; });
    return q.mot;
  }
  function ecranFin(typoId) {
    const t = typo(typoId);
    const cid = S.vue.carnet;
    const p = progresCarnet(typoId, cid);
    const sp = scoreEtProgres(p);
    const qual = qualificatifPour(sp.pct);
    const titre = (qual ? qual + " chasseur" : "Chasseur") + " de trésors " + t.motLieu;

    const e = el("div", "ecran");
    const c = el("div", "fin-contenu");
    const zoe = el("div", "zoe-fin");
    zoe.innerHTML = zoeBox(96, "fier", { sparks: false });
    c.appendChild(zoe);
    c.appendChild(el("span", "lab", "Diplôme officiel"));
    c.appendChild(el("h2", null, titre));

    const ann = el("div", "anneau-fin");
    ann.style.background = "conic-gradient(var(--hero) " + sp.pct + "%, var(--hero-soft) 0)";
    const disque = el("div", "disque");
    disque.appendChild(el("div", "n", (sp.faits - sp.raresFaits)));
    disque.appendChild(el("div", "lg", "sur " + (sp.total - sp.totalRares)));
    ann.appendChild(disque);
    c.appendChild(ann);

    const stats = el("div", "stats-3");
    const s1 = el("div", "stat"); s1.innerHTML = '<div class="val hero-c">' + sp.pts + '</div><div class="lab">points</div>';
    const s2 = el("div", "stat or"); s2.innerHTML = '<div class="val">' + sp.raresFaits + '★</div><div class="lab">rares</div>';
    stats.appendChild(s1); stats.appendChild(s2);
    c.appendChild(stats);

    const auj = new Date();
    c.appendChild(el("div", "fin-dedicace",
      "Décerné à toute l'équipe, le " + auj.getDate() + " " +
      ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][auj.getMonth()] +
      ", pour avoir cherché plus loin que prévu."));

    const actions = el("div", "fin-actions");
    const suite = el("button", "btn creux", "Continuer à chercher");
    suite.addEventListener("click", function () { aller("jeu", typoId, cid); });
    const accueil = el("button", "btn", "Choisir une autre sortie");
    accueil.addEventListener("click", function () {
      S.vue = { ecran: "accueil" };
      sauver(); dessiner();
    });
    actions.appendChild(suite);
    actions.appendChild(accueil);
    c.appendChild(actions);

    e.appendChild(c);
    setTimeout(function () { lancerConfettis(sp.pct >= 100 ? 70 : 40); }, 150);
    return e;
  }

  /* ============================================================
     DÉMARRAGE
     ============================================================ */
  dessiner();

  if (capacitorNatif()) {
    const Plugins = window.Capacitor.Plugins;
    if (Plugins.StatusBar) {
      Plugins.StatusBar.setStyle({ style: "DARK" }).catch(function () {});
      Plugins.StatusBar.setBackgroundColor({ color: "#F1F7F4" }).catch(function () {});
    }
    if (Plugins.SplashScreen) Plugins.SplashScreen.hide().catch(function () {});
    if (Plugins.App) {
      Plugins.App.addListener("backButton", function () {
        if (S.vue.ecran !== "accueil") { S.vue = { ecran: "accueil" }; sauver(); dessiner(); }
        else Plugins.App.exitApp();
      });
    }
  }
})();
</script>
